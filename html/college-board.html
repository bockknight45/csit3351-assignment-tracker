<!DOCTYPE html>
<html>

<head>
    <title>Assignment Tracker</title>
    <link rel="stylesheet" href="../css/college-board.css">
    <script src="../js/app.js"></script>
</head>

<body>

    <header id="header"></header>

    <nav id="nav"></nav>

    <main>

        <h2>Fall 2026</h2>

        <section class="stats">
            <div class="stat">
                <p class="stat-number" id="dueWeek"></p>
                <p>Due this week</p>
            </div>
            <div class="stat">
                <p class="stat-number" id="overdueCount"></p>
                <p>Overdue</p>
            </div>
            <div class="stat">
                <p class="stat-number" id="averageGrade"></p>
                <p>Average grade</p>
            </div>
        </section>

        <h3>Add Assignment</h3>
        <div class="add-form">
            <input type="text" id="assignmentTitle" placeholder="Assignment title"
                onkeydown="pressEnter(event, addAssignmentFromForm)">
            <select id="assignmentClass"></select>
            <label>Due: <input type="date" id="assignmentDate"></label>
            <button onclick="addAssignmentFromForm()">Add Assignment</button>
        </div>

        <h3>Assignments</h3>
        <div class="controls">
            <input type="text" id="search" placeholder="Search" oninput="showPage()">
            <select id="filterClass" onchange="showPage()"></select>
            <select id="sortBy" onchange="showPage()">
                <option value="dueDate">Sort by due date</option>
                <option value="class">Sort by class</option>
                <option value="title">Sort by title</option>
            </select>
        </div>

        <section class="card-list" id="assignmentList"></section>

    </main>

    <script src="../js/home.js"></script>

</body>

</html>
