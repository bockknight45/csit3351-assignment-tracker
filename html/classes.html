<!DOCTYPE html>
<html>

<head>
    <title>Classes</title>
    <link rel="stylesheet" href="../css/college-board.css">
    <script src="../js/app.js"></script>
</head>

<body>

    <header id="header"></header>

    <nav id="nav"></nav>

    <main>

        <h2>Classes</h2>

        <div class="add-form">
            <input type="text" id="className" placeholder="Class name"
                onkeydown="pressEnter(event, addClass)">
            <input type="text" id="classTime" placeholder="Meeting time"
                onkeydown="pressEnter(event, addClass)">
            <label>Color: <input type="color" id="classColorInput"></label>
            <button onclick="addClass()">Add Class</button>
        </div>

        <section class="card-list" id="classList"></section>

    </main>

    <script src="../js/classes.js"></script>

</body>

</html>
